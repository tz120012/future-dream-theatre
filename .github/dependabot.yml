version: 2

# 只自动跟 minor / patch：大版本升级往往需要改代码，交给维护者手动评估。
# 典型例子：av 19 移除了 faster-whisper 仍在使用的 av.open(metadata_errors=)，
# 升上去会直接破坏本地语音识别，所以 requirements.txt 里刻意钉了 av<19。

updates:
  # 前端依赖（React / Vite / TypeScript / oxlint）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 后端依赖（FastAPI / faster-whisper / ctranslate2 / Pillow）
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 版本：大版本单独评估（inputs 常变）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

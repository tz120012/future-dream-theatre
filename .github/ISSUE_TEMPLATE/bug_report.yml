name: 🐞 Bug 报告
description: 功能不正常、报错、白屏、卡住等
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先确认：
        - 已经看过 [部署说明](https://github.com/tz120012/future-dream-theatre/blob/main/deploy/部署说明.md) 里的常见问题
        - **不要粘贴 API Key、孩子的照片或录音**；日志里的 Key 请用 `***` 代替
  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 启动 / 部署
        - 语音识别（孩子说话没转写出来）
        - 语音播报（声音不对 / 没有声音）
        - 对话与梦想理解
        - 生成梦想卡（图片）
        - 拍照 / 摄像头
        - 页面显示与交互
        - 其他
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 运行方式
      options:
        - Docker Compose
        - 一键部署包（一键部署.bat）
        - 本地开发（npm run dev + uvicorn）
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 页面底部版本号、部署包的 `版本.txt`，或 `git rev-parse --short HEAD`
      placeholder: v2.0.0 / 6e90ff4
  - type: input
    id: env
    attributes:
      label: 系统与浏览器
      placeholder: Windows 11 23H2 / Chrome 128 / Docker Desktop 4.34
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开首页，选择老师课堂模式
        2. 完成三轮访谈
        3. 点击「生成梦想卡」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: 用 `查看日志.bat` 导出容器日志，或贴浏览器控制台报错（请先去掉 Key 与个人信息）
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容里没有 API Key、儿童照片或录音
          required: true
